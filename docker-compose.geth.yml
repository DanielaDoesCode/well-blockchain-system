services:

  postgres:
    image: postgres:latest
    container_name: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=well_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - well-net

  geth:
    image: ethereum/client-go:v1.13.15
    container_name: geth
    command: >
      --datadir /data
      --networkid 1337
      --http --http.addr 0.0.0.0 --http.port 8545
      --http.api eth,web3,net,personal,admin,txpool
      --ws --ws.addr 0.0.0.0 --ws.port 8546
      --ws.api eth,web3,net
      --allow-insecure-unlock
      --unlock 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266,0x70997970C51812dc3A010C7d01b50e0d17dc79C8,0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC,0x90F79bf6EB2c4f870365E785982E1f101E93b906,0x15d34AAf54267DB7D7c367839AAf71A00a2C6A65,0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc,0x976EA74026E726554dB657fA54763abd0C3a0aa9,0x14dC79964da2C08b23698B3D3cc7Ca32193d9955,0x23618e81E3f5cdF7f54C3d65f7FBc0aBf5B21E8f,0xa0Ee7A142d267C1f36714E4a8F75612F20a79720
      --password /data/password.txt
      --mine --miner.etherbase 0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266
        --miner.gasprice 0
        --miner.gaslimit 30000000
        --rpc.gascap 1000000000
      --txlookuplimit 0
      --nodiscover --maxpeers 0
    ports:
      - "8545:8545"
      - "8546:8546"
    volumes:
      - ./genesis.json:/genesis.json:ro
      - ./password.txt:/data/password.txt:ro
      - geth_data:/data
    networks:
      - well-net

  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs
    ports:
      - "5001:5001"
      - "8080:8080"
    volumes:
      - ipfs_data:/data/ipfs
    networks:
      - well-net

  vault:
    image: hashicorp/vault:latest
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: well-dev-token
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks:
      - well-net

networks:
  well-net:
    driver: bridge

volumes:
  postgres_data:
  geth_data:
  ipfs_data:
